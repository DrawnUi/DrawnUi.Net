  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    Embedding level of every UTF-16 unit of <code class="paramref">text</code>, one line of a paragraph whose direction is

    <code class="paramref">rightToLeft</code>. Even = left to right, odd = right to left. Trailing whitespace gets the

    paragraph level (rule L1).
  example: []
  syntax:
    content: public static byte[] GetLevels(ReadOnlySpan<char> text, bool rightToLeft)
    parameters:
    - id: text
      type: System.ReadOnlySpan{System.Char}
    - id: rightToLeft
      type: System.Boolean
    return:
      type: System.Byte[]
    content.vb: Public Shared Function GetLevels(text As ReadOnlySpan(Of Char), rightToLeft As Boolean) As Byte()
