  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    Implementation for <xref href="DrawnUi.Draw.LayoutType.Masonry" data-throw-if-not-resolved="false"></xref>: columns of equal width, every item goes to the

    shortest column, so items of different heights leave no gaps under the shorter ones. Items keep their

    order across the columns as far as the heights allow (item 0 is top left). Every item is measured,

    whatever <xref href="DrawnUi.Draw.SkiaLayout.MeasureItemsStrategy" data-throw-if-not-resolved="false"></xref> says: a column's height depends on all items above.

    The structure is keyed (column, row inside that column) and filled in item order.
