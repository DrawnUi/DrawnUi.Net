  namespace: DrawnUi.Draw
  summary: >-
    A canvas view that draws with a GPU context of its own (not a <code>SkiaViewAccelerated</code>), such as the WebGL view

    of the WebAssembly head or the OpenGL drawable of OpenTK. <code>DrawnView.GetGRContext</code> reads it, so GPU caches are

    made on that context.
