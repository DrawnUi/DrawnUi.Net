  namespace: DrawnUi.Draw.Meshes
  summary: >-
    A custom mesh: specification, vertices, optional indices, uniforms and children, drawn with

    <xref href="DrawnUi.Draw.Meshes.SKMeshCanvasExtensions.DrawMesh(SkiaSharp.SKCanvas%2cDrawnUi.Draw.Meshes.SKMesh%2cSkiaSharp.SKPaint)" data-throw-if-not-resolved="false"></xref> (stand-in for SkiaSharp's SKMesh).

    Drawn through <code>SKCanvas.DrawVertices</code> and one runtime shader, so it also draws on raster (CPU) canvases.
