  summary: >-
    Adds an action, or replaces the one with the same path. <code class="paramref">run</code> is called on the

    app's UI thread when the designer runs it. Dispose the result to remove the action again (one a

    screen offers while it is shown).
  example: []
  syntax:
    content: public static IDisposable Add(string path, Action run)
    parameters:
    - id: path
      type: System.String
      description: "The action's name with its groups before it: <code>\"Levels/Level 3\"</code>."
    - id: run
      type: System.Action
      description: What the action does in the app.
    return:
      type: System.IDisposable
    content.vb: Public Shared Function Add(path As String, run As Action) As IDisposable
