  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    Actions an app declares for the DrawnUI Designer: named states it can jump to without being played

    to them (a level, a game state, a dialog). The designer lists them under the app's screens and runs

    one on a click; AI agents run them through the designer's MCP (<code>list_actions</code>, <code>run_action</code>).

    <p>

    A path names the action and its groups, slash-separated: <code>"Levels/Level 3"</code> shows as

    "Level 3" under "Levels". Nothing here runs unless a designer is attached: the list only keeps the

    names and their callbacks, and an app built without the designer agent never reads it.

    </p>


    <pre><code class="lang-csharp">for (var i = 1; i &lt;= 20; i++)

    {
        var level = i;
        DesignerActions.Add($"Levels/Level {level}", () =&gt; Game.StartLevel(level));
    }

    DesignerActions.Add("Dialogs/Options", () =&gt; Game.ShowOptions());</code></pre>
  example: []
  syntax:
    content: public static class DesignerActions
    content.vb: Public Module DesignerActions
