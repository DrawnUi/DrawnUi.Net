  summary: >-
    For heads: the canvas's keyboard navigation used <code class="paramref">key</code>, so the <xref href="DrawnUi.Draw.KeyboardManager.KeyDown" data-throw-if-not-resolved="false"></xref> raised next for

    that key reports <xref href="DrawnUi.Draw.KeyboardManager.IsKeyHandled" data-throw-if-not-resolved="false"></xref>. Call it before <xref href="DrawnUi.Draw.KeyboardManager.KeyboardPressed(DrawnUi.Draw.InputKey%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>; the key's

    release forgets it.
