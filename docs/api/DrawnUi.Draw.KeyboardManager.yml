  source:
    remote:
      path: src/Shared/DrawnUi/Features/Keyboard/KeyboardManager.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: IsKeyForOtherElement
    path: ../src/Shared/DrawnUi/Features/Keyboard/KeyboardManager.cs
    startLine: 20
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    True while <xref href="DrawnUi.Draw.KeyboardManager.KeyDown" data-throw-if-not-resolved="false"></xref>, <xref href="DrawnUi.Draw.KeyboardManager.KeyUp" data-throw-if-not-resolved="false"></xref> or <xref href="DrawnUi.Draw.KeyboardManager.KeyChar" data-throw-if-not-resolved="false"></xref> is raised for a key that a focused

    element outside DrawnUI receives: a page input next to the canvas, a native text field. Every key is reported,

    but such a key is not for drawn controls: observe it, never act on it as typing or a shortcut. Drawn editors and

    text selection ignore it.
  example: []
  syntax:
    content: public static bool IsKeyForOtherElement { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Shared Property IsKeyForOtherElement As Boolean
  overload: DrawnUi.Draw.KeyboardManager.IsKeyForOtherElement*
- uid: DrawnUi.Draw.KeyboardManager.IsKeyHandled
  commentId: P:DrawnUi.Draw.KeyboardManager.IsKeyHandled
  id: IsKeyHandled
  parent: DrawnUi.Draw.KeyboardManager
  langs:
  - csharp
  - vb
  name: IsKeyHandled
  nameWithType: KeyboardManager.IsKeyHandled
  fullName: DrawnUi.Draw.KeyboardManager.IsKeyHandled
  type: Property
  source:
    remote:
      path: src/Shared/DrawnUi/Features/Keyboard/KeyboardManager.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: IsKeyHandled
    path: ../src/Shared/DrawnUi/Features/Keyboard/KeyboardManager.cs
    startLine: 28
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    True while <xref href="DrawnUi.Draw.KeyboardManager.KeyDown" data-throw-if-not-resolved="false"></xref> is raised for a key the canvas's keyboard navigation has already used: Tab moved

    the focus, Enter / Space activated the focused control, an arrow moved inside a list or a menu or stepped a

    slider, Escape let the drawn controls go. An app handler that would act on the same key (a menu that opens on

    Enter) skips it, so one press does one thing. The canvas handles the key first, then KeyDown is raised.
  example: []
  syntax:
    content: public static bool IsKeyHandled { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Shared Property IsKeyHandled As Boolean
  overload: DrawnUi.Draw.KeyboardManager.IsKeyHandled*
