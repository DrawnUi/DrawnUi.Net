  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    Caret X before the code unit <code class="paramref">index</code> of a line with <xref href="DrawnUi.Draw.TextLine.Carets" data-throw-if-not-resolved="false"></xref>, relative to the line's

    left edge: the trailing edge of the previous character (its right edge when it reads left to right, its left

    edge when right to left), the leading edge of the first character at the line start. So the caret stays with

    the text just typed.
