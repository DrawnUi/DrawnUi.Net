  assemblies:
  - DrawnUi.Maui.Add3d
  namespace: DrawnUi.Add3d
  summary: >-
    A box with rounded edges and corners (a die, a soap bar, a phone, a cushion), centered; <code class="paramref">radius</code>

    in the box's units, at most half its smallest side. An image covers each face whole, upright on the sides, as on

    <xref href="DrawnUi.Add3d.Mesh3D.Cuboid(System.Single%2cSystem.Single%2cSystem.Single)" data-throw-if-not-resolved="false"></xref>; with <code class="paramref">atlas</code> each face takes its own cell of one image split 3 x 2, in the

    order +X, -X, +Y on the top row and -Y, +Z, -Z on the bottom row (a die's six faces in one image).
  example: []
  syntax:
    content: public static Mesh3D RoundedCuboid(float width, float height, float depth, float radius, bool atlas = false)
    parameters:
    - id: width
      type: System.Single
    - id: height
      type: System.Single
    - id: depth
      type: System.Single
    - id: radius
      type: System.Single
    - id: atlas
      type: System.Boolean
