  summary: >-
    A 3D model made in code: named, colored parts, each a <xref href="DrawnUi.Add3d.Mesh3D" data-throw-if-not-resolved="false"></xref> with its own place (At, Turned, Scaled)

    and optionally hung under another part (Inside), for <xref href="DrawnUi.Add3d.SkiaModel3D" data-throw-if-not-resolved="false"></xref> and <xref href="DrawnUi.Add3d.SkiaScene3D.Model(System.String%2cDrawnUi.Add3d.Model3D)" data-throw-if-not-resolved="false"></xref>.

    A part is a node and a material of its own name, so SetNode* and SetMaterialColor drive it like a part of a model

    file. The calls after <xref href="DrawnUi.Add3d.Model3D.Part(System.String%2cDrawnUi.Add3d.Mesh3D%2cMicrosoft.Maui.Graphics.Color)" data-throw-if-not-resolved="false"></xref> change the part just added.
