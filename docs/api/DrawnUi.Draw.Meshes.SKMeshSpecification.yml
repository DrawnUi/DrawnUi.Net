  summary: >-
    Vertex layout plus the SkSL vertex and fragment programs of a custom mesh (stand-in for SkiaSharp's

    SKMeshSpecification). Same rules as Skia's SkMesh: vertex program <code>Varyings main(const Attributes a)</code>,

    fragment program <code>float2 main(const Varyings v)</code> or <code>float2 main(const Varyings v, out half4|float4 color)</code>.
