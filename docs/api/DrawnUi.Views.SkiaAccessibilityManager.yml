  type: Method
  source:
    remote:
      path: src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: RefreshIfStale
    path: ../src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
    startLine: 1035
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Views
  summary: >-
    Rebuilds the snapshot now when frames were drawn since the last rebuild (the <xref href="DrawnUi.Views.SkiaAccessibilityManager.MinUpdateIntervalMs" data-throw-if-not-resolved="false"></xref>

    rate limit skipped them), so keyboard navigation never walks the nodes of a page that just left the screen

    while the canvas sits idle. Free when the snapshot is current, draws no frame. Call it on the thread that

    renders the canvas, or on any thread when rebuilds are rare (it is serialized; MAUI Windows renders on a worker).

    True when the snapshot changed.
  example: []
  syntax:
    content: public bool RefreshIfStale(float scale)
    parameters:
    - id: scale
      type: System.Single
    return:
      type: System.Boolean
    content.vb: Public Function RefreshIfStale(scale As Single) As Boolean
  overload: DrawnUi.Views.SkiaAccessibilityManager.RefreshIfStale*
  nameWithType.vb: SkiaAccessibilityManager.RefreshIfStale(Single)
