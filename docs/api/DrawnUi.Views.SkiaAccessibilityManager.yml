      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: IsTabStop
    path: ../src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
    startLine: 155
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Views
  summary: >-
    Whether Tab / Shift+Tab stop on this node. A group of items (<xref href="DrawnUi.Views.SkiaAccessibilityManager.TryFindGroup(DrawnUi.Draw.SkiaControl%2cDrawnUi.Draw.SkiaControl%40%2cDrawnUi.Draw.SkiaControl%40)" data-throw-if-not-resolved="false"></xref>) is one Tab stop,

    like a native list: its current item, the one keyboard focus last had there (else the group's first usable

    node), plus the controls inside that same item, then Tab leaves the group. The arrow keys move between items.

    Every node outside a group is a stop.
  example: []
  syntax:
    content: public bool IsTabStop(ISkiaAccessibilityNode? node)
    parameters:
    - id: node
      type: DrawnUi.Draw.ISkiaAccessibilityNode
    return:
      type: System.Boolean
    content.vb: Public Function IsTabStop(node As ISkiaAccessibilityNode) As Boolean
  overload: DrawnUi.Views.SkiaAccessibilityManager.IsTabStop*
  nameWithType.vb: SkiaAccessibilityManager.IsTabStop(ISkiaAccessibilityNode)
  fullName.vb: DrawnUi.Views.SkiaAccessibilityManager.IsTabStop(DrawnUi.Draw.ISkiaAccessibilityNode)
  name.vb: IsTabStop(ISkiaAccessibilityNode)
- uid: DrawnUi.Views.SkiaAccessibilityManager.MoveInGroup(DrawnUi.Draw.SkiaControl,DrawnUi.Draw.InputKey)
  commentId: M:DrawnUi.Views.SkiaAccessibilityManager.MoveInGroup(DrawnUi.Draw.SkiaControl,DrawnUi.Draw.InputKey)
  id: MoveInGroup(DrawnUi.Draw.SkiaControl,DrawnUi.Draw.InputKey)
  parent: DrawnUi.Views.SkiaAccessibilityManager
  langs:
  - csharp
  - vb
  name: MoveInGroup(SkiaControl, InputKey)
  nameWithType: SkiaAccessibilityManager.MoveInGroup(SkiaControl, InputKey)
  fullName: DrawnUi.Views.SkiaAccessibilityManager.MoveInGroup(DrawnUi.Draw.SkiaControl, DrawnUi.Draw.InputKey)
  type: Method
  source:
    remote:
      path: src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: MoveInGroup
    path: ../src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
    startLine: 203
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Views
  summary: >-
    Moves keyboard focus between the items of the group around <code class="paramref">focused</code> (<xref href="DrawnUi.Views.SkiaAccessibilityManager.TryFindGroup(DrawnUi.Draw.SkiaControl%2cDrawnUi.Draw.SkiaControl%40%2cDrawnUi.Draw.SkiaControl%40)" data-throw-if-not-resolved="false"></xref>),

    by item index like a native list: Down / Up in a Column, Right / Left in a Row, all four in a Wrap, a Grid or a

    Split layout (Up / Down by one row), Home / End to the first / last item, PageDown / PageUp by one viewport of the

    scroll around it. No wrap at the ends. The target is the item itself when it is an interactive node, else its

    first interactive node; items the pointer cannot use are skipped. An item not realized yet (recycled cells, large

    windowed ItemsSource) is scrolled in with ScrollToIndex when the group is the scroll's content, and focused once drawn.

    Returns true when the key belongs to the group.
  example: []
  syntax:
    content: public bool MoveInGroup(SkiaControl focused, InputKey key)
    parameters:
    - id: focused
      type: DrawnUi.Draw.SkiaControl
    - id: key
      type: DrawnUi.Draw.InputKey
    return:
      type: System.Boolean
    content.vb: Public Function MoveInGroup(focused As SkiaControl, key As InputKey) As Boolean
  overload: DrawnUi.Views.SkiaAccessibilityManager.MoveInGroup*
