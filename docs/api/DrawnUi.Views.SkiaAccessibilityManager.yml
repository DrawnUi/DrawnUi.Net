  nameWithType: SkiaAccessibilityManager.RebuildSkipped
  fullName: DrawnUi.Views.SkiaAccessibilityManager.RebuildSkipped
  type: Event
  source:
    remote:
      path: src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: RebuildSkipped
    path: ../src/Shared/DrawnUi/Views/SkiaAccessibilityManager.cs
    startLine: 67
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Views
  summary: >-
    The rate limit skipped a rebuild: frames moved or changed nodes and the snapshot is stale until the next

    frame end after the interval. Raised once per stale period, on the rendering thread, with the milliseconds

    left until a rebuild may run. A head whose canvas can go idle right after a change (a page that just opened)

    calls <xref href="DrawnUi.Views.SkiaAccessibilityManager.RefreshIfStale(System.Single)" data-throw-if-not-resolved="false"></xref> then, on its rendering thread, so assistive technology never keeps the

    previous page's nodes: no frame is drawn for it.
  example: []
  syntax:
    content: public event Action<long>? RebuildSkipped
    return:
      type: System.Action{System.Int64}
    content.vb: Public Event RebuildSkipped As Action(Of Long)
