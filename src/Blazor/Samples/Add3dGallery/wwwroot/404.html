<!doctype html>
<!-- Cloudflare Pages serves this, with status 404, for any address the site does not have (a
     missing model under /assets/ included), instead of the app's page with status 200. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121218" />
    <title>Not found · DrawnUI 3D</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121218;
        color: #e8e8f0;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 420px; padding: 24px 16px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; color: #9a9ab0; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        background: #f5b83d;
        color: #1c1608;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover, a:focus-visible { background: #ffc95a; outline: 2px solid #ffffff55; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Not found</h1>
      <p>There is nothing at this address.</p>
      <a href="/">Open the 3D demo</a>
    </main>
  </body>
</html>
