<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawnUI 3D</title>
    <meta name="description" content="3D models inside a DrawnUI screen on pure .NET WebAssembly: glTF characters with skeleton animations, shapes made in code, a field of mobs drawn in one pass.">
    <meta name="theme-color" content="#0E1018">
    <link rel="icon" href="favicon.ico">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0E1018; }
        #drawnui-canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
        /* The loading screen, as the DrawnUI for Rust gallery (add3d.drawnui.net): the title over a glow, the download
           progress, gone with the app's first drawn frame. */
        .loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 22px; transition: opacity 0.35s;
                  background: radial-gradient(ellipse at 50% 55%, #241f45 0%, #0e1018 65%); }
        .loader.done { opacity: 0; pointer-events: none; }
        .loader-title { font: 800 44px system-ui, sans-serif; letter-spacing: 2px; text-align: center; padding: 0 16px;
                        background: linear-gradient(#ffffff, #c9c0ff 55%, #7c6cf2);
                        -webkit-background-clip: text; background-clip: text; color: transparent;
                        animation: loader-glow 1.6s ease-in-out infinite; }
        .loader-bar { width: min(260px, 60vw); height: 4px; border-radius: 2px; overflow: hidden; background: #221f3a; }
        .loader-fill { height: 100%; width: var(--load-percentage, 0%); transition: width 0.2s;
                       background: linear-gradient(90deg, #7c6cf2, #c9c0ff); box-shadow: 0 0 10px #7c6cf2; }
        .loader-text { font: 12px system-ui, sans-serif; letter-spacing: 3px; color: #8b86a8; }
        .loader-text::after { content: " " var(--load-percentage-text, ""); }
        @keyframes loader-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(124, 108, 242, 0.45)); }
            35% { filter: drop-shadow(0 0 22px rgba(124, 108, 242, 0.8)); }
            60% { filter: drop-shadow(0 0 14px rgba(124, 108, 242, 0.55)); }
        }
        @media (prefers-reduced-motion: reduce) { .loader-title { animation: none; } }
    </style>
</head>
<body>
    <canvas id="drawnui-canvas"></canvas>
    <div class="loader" role="progressbar" aria-label="Loading DrawnUI 3D Demo" aria-valuemin="0" aria-valuemax="100">
        <div class="loader-title">DRAWNUI 3D DEMO</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
        <div class="loader-text">LOADING</div>
    </div>
    <script>
        // Download progress into the loading screen, and its exit (called by the app after its first drawn frame).
        window.add3dLoaderProgress = (loaded, total) => {
            const loader = document.querySelector(".loader");
            if (!loader || !total) return;
            const percent = Math.min(100, (loaded / total) * 100);
            loader.style.setProperty("--load-percentage", `${percent}%`);
            loader.style.setProperty("--load-percentage-text", `"${Math.round(percent)}%"`);
            loader.setAttribute("aria-valuenow", String(Math.round(percent)));
        };
        window.add3dLoaderDone = () => {
            const loader = document.querySelector(".loader");
            if (!loader) return;
            loader.classList.add("done");
            setTimeout(() => loader.remove(), 400);
        };
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
