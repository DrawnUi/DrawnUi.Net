<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawnApp</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#0B0E14" />
    <style>
        /* The canvas fills the window: every wrapper down to the canvas gets the full height. */
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0E14; }
        #app, .drawn-host { height: 100%; display: flex; flex-direction: column; }
        .drawn-host > * { flex: 1 1 auto; min-height: 0; }
        .boot { margin: auto; color: #A9B4C6; font: 14px system-ui, sans-serif; }
    </style>
    <script type="importmap"></script>
</head>

<body>
    <div id="app"><div class="boot">Loading…</div></div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
